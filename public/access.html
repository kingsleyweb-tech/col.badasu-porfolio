<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07150d" />
    <link rel="icon" type="image/svg+xml" href="/crest.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/access.css" />
    <title>Official Portfolio · Restricted Access</title>
  </head>
  <body>
    <main class="ac">
      <div class="in">
        <img class="crest" src="/crest.svg" alt="Ghana Armed Forces crest" width="92" height="92" />
        <div class="pre">Official Portfolio · Restricted Access</div>
        <h1>Enter your <em>access code</em></h1>
        <p class="intro" id="intro">This portfolio is shared privately. Enter the access code you were given to continue.</p>

        <form id="form" novalidate>
          <label for="code">Access code</label>
          <div class="field">
            <input id="code" name="code" type="password" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" maxlength="100" aria-describedby="msg" required />
            <button type="button" class="show" id="show" aria-controls="code" aria-pressed="false">Show</button>
          </div>
          <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
          <button class="cta" id="submit" type="submit">
            <span><small>CONTINUE TO</small><b>The portfolio</b></span>
            <i aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </i>
          </button>
        </form>

        <p class="note">Access lasts one hour, then the code is needed again.</p>
      </div>
    </main>
    <script src="/access.js" defer></script>
  </body>
</html>
